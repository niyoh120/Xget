name: Sync fork from upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync fork with upstream
        run: gh repo sync ${{ github.repository }} --source xixu-me/xget --branch main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
